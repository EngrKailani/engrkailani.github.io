name: Produce optimized home images
on:
  push:
    branches: [main]
    paths:
      - scripts/optimize-home-images.py
      - .github/workflows/optimize-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-home-images.py
      - name: Commit generated WebP images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*-home.webp assets/sls-rocket-kailani-mobile.webp
          if ! git diff --cached --quiet; then
            git commit -m "Generate optimized responsive homepage photographs"
            git push
          fi
