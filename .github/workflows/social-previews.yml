name: Generate social sharing previews

on:
  push:
    paths:
      - scripts/build-social-previews.py
      - projects/index.html
      - projects/directory-thumbnails/**
      - projects/powershell/visuals/lab_workflows.svg
      - projects/huemotion/visuals/gesture_scene_map.svg
      - .github/workflows/social-previews.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-previews
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project preview renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow
      - name: Render portfolio and project cards
        run: python scripts/build-social-previews.py
      - name: Validate all 19 generated PNGs
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          paths=list(Path("social").glob("*.png"))
          assert len(paths)==19, f"Expected 19 PNG previews, got {len(paths)}"
          for path in paths:
              with Image.open(path) as im:
                  assert im.format=="PNG" and im.size==(1200,630), path
          print("Validated",len(paths),"PNG previews")
          PY
      - name: Publish generated sharing images
        run: |
          git add social/*.png
          if git diff --cached --quiet; then
            echo "Preview PNGs already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish 19 project-specific social image previews"
          git pull --rebase origin main
          git push origin main
