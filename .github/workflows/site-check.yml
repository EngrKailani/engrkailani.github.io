name: Static portfolio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          for file in *.js scripts/*.js; do node --check "$file"; done
      - name: Verify pages, links and canonical host
        run: node scripts/site-check.js
