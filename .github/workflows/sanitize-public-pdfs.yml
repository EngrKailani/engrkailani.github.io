name: Publish NASA-figure-free CV and Resume PDFs

on:
  push:
    paths:
      - scripts/sanitize_nasa_public_pdfs.py
      - .github/workflows/sanitize-public-pdfs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanitize-public-pdfs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and font dependencies
        run: |
          python -m pip install --disable-pip-version-check pymupdf==1.26.7
          sudo apt-get update -qq
          sudo apt-get install -y fonts-croscore
      - name: Redact public technical figures and validate text
        run: python scripts/sanitize_nasa_public_pdfs.py
      - name: Publish updated PDFs to website assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Kailani_Alarcon_CV.pdf assets/Kailani_Alarcon_Master_Resume.pdf
          if git diff --cached --quiet; then
            echo "No PDF updates to publish"
            exit 0
          fi
          git commit -m "Publish public CV and resume without NASA numerical details"
          git push origin HEAD:main
