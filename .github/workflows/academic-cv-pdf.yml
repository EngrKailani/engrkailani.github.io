name: Preview HTML academic CV as PDF

# The public definitive CV is assets/Kailani_Alarcon_CV.pdf, uploaded
# byte-for-byte from the user-supplied three-page PDF.
# This manual workflow only previews the site's HTML adaptation; it never
# commits or overwrites a CV in the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tooling
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render optional HTML-derived CV preview
        run: node scripts/build-academic-cv-pdf.js
      - name: Archive optional preview without publishing
        uses: actions/upload-artifact@v4
        with:
          name: html-cv-preview-not-official
          path: assets/Kailani_Alarcon_Academic_CV.pdf
          if-no-files-found: error
