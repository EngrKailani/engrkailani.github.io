<rect x="570" y="576" width="174" height="35" rx="7" fill="#ecf1f5" stroke="#ecf1f5" stroke-width="1"/><text x="583" y="600" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#485e6f" font-weight="700" >TOOL  |  8.5 in</text>
