<line x1="860" y1="520" x2="1114" y2="520" stroke="#d4dee5" stroke-width="1" />
<text x="860" y="554" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5a6c79" font-weight="500" >Folded pose is schematic.</text>
