<pattern id="chamber-grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#dee6eb" stroke-width="1"/></pattern>
<linearGradient id="back" x1="0" x2="0.1" y1="0" y2="1"><stop offset="0" stop-color="#fafcfd"/><stop offset="1" stop-color="#e7eef3"/></linearGradient>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#326085"/></marker></defs>
<rect width="1200" height="760" fill="#fdfcfb"/>
<rect width="1200" height="760" fill="url(#minor-grid)"/>
