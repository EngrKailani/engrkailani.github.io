<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="fig1-title fig1-desc">
<title id="fig1-title">Ceiling-mounted robotic arm centered inside a cubic chamber</title>
<desc id="fig1-desc">Reconstructed conceptual diagram, not to scale, showing a ceiling-mounted robotic arm with a centrally located shoulder mount inside a simple 36 by 36 by 36 inch cube. Link 1 and link 2 are 18.5 inches each, the tool length is 8.5 inches, and the ceiling-to-shoulder offset is 3 inches. Joints are shown with simplified shapes.</desc>
