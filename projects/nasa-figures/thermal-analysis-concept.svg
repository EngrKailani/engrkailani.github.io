<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t-thermal d-thermal">
<title id="t-thermal">Thermal Analysis Workstream</title>
<desc id="d-thermal">Qualitative steady-state and transient thermal modeling concept using an intentionally generic robotic-arm silhouette. The geometry is illustrative and not project hardware.</desc>
<defs>
  <pattern id="grid-thermal" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e7edf1" stroke-width="1"/></pattern>
  <pattern id="major-thermal" width="125" height="125" patternUnits="userSpaceOnUse"><path d="M125 0H0V125" fill="none" stroke="#d6e1e8" stroke-width="1.5"/></pattern>
  <linearGradient id="temp" x1="0" x2="1" y1="1" y2="0"><stop offset="0%" stop-color="#3c83bc"/><stop offset="30%" stop-color="#67afbe"/><stop offset="60%" stop-color="#a6bd89"/><stop offset="82%" stop-color="#e5aa62"/><stop offset="100%" stop-color="#be6869"/></linearGradient>
</defs>

<rect width="1200" height="760" fill="#fcfbfa"/>
<rect width="1200" height="760" fill="url(#grid-thermal)"/>
<rect width="1200" height="760" fill="url(#major-thermal)"/>
<rect x="22" y="22" width="1156" height="716" rx="20" fill="none" stroke="#b9c6cf" stroke-width="2"/>

<text x="68" y="93" font-family="Arial,Helvetica,sans-serif" font-size="45" fill="#1e3043" font-weight="700">Thermal Analysis Workstream</text>
<text x="68" y="130" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#53677b">Steady-state and transient modeling in a high-vacuum context</text>
<line x1="68" y1="152" x2="1132" y2="152" stroke="#cbd8e1" stroke-width="2"/>

<rect x="65" y="179" width="780" height="312" rx="18" fill="#f1f5f7" stroke="#bbc9d4" stroke-width="2"/>
<text x="90" y="215" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#62758a" font-weight="700">GENERIC ROBOTIC-ARM SILHOUETTE · NOT TO SCALE</text>

<!-- Intentionally generic icon-like arm. Proportions and joint locations do not represent project hardware. -->
<rect x="135" y="414" width="120" height="42" rx="9" fill="#94a8b6" stroke="#5c7587" stroke-width="3"/>
<circle cx="195" cy="405" r="31" fill="#e0e8eb" stroke="#526879" stroke-width="7"/>
<path d="M195 405 L325 300 L460 385 L590 300" fill="none" stroke="#526475" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M195 405 L325 300 L460 385 L590 300" fill="none" stroke="url(#temp)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="325" cy="300" r="31" fill="#e0e8eb" stroke="#526879" stroke-width="7"/>
<circle cx="460" cy="385" r="31" fill="#e0e8eb" stroke="#526879" stroke-width="7"/>
<circle cx="590" cy="300" r="27" fill="#e0e8eb" stroke="#526879" stroke-width="7"/>
<path d="M610 286 l54 -26 M610 314 l54 26" stroke="#526879" stroke-width="12" stroke-linecap="round"/>
<text x="90" y="474" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#506578">Illustrative geometry only. No dimensions, link lengths, joint coordinates, or hardware configuration are represented.</text>

<rect x="860" y="198" width="260" height="40" rx="10" fill="#e8edf2"/>
<text x="874" y="224" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#455e74" font-weight="700">LEGEND · RELATIVE</text>
<rect x="904" y="271" width="54" height="149" rx="5" fill="url(#temp)" stroke="#91a7b5" stroke-width="2"/>
<text x="974" y="298" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#526c7e" font-weight="600">Warmer</text>
<text x="974" y="422" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#526c7e" font-weight="600">Cooler</text>
<text x="866" y="447" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#506578">Colors show a qualitative</text>
<text x="866" y="470" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#506578">example only. No measured</text>
<text x="866" y="493" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#506578">temperatures or margins.</text>

<rect x="65" y="519" width="514" height="143" rx="15" fill="#f8fafb" stroke="#b6c8d3" stroke-width="2"/>
<rect x="88" y="525" width="200" height="40" rx="10" fill="#e7ecf6"/>
<text x="102" y="551" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536881" font-weight="700">STEADY-STATE</text>
<text x="91" y="590" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#455d70" font-weight="500">Concept: stable thermal distribution</text>
<text x="91" y="619" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#455d70" font-weight="500">under fixed boundary conditions.</text>
<text x="91" y="648" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#455d70" font-weight="500">Not a solver result or test plot.</text>

<rect x="610" y="519" width="522" height="143" rx="15" fill="#f9f9fc" stroke="#b7c3d4" stroke-width="2"/>
<rect x="634" y="525" width="159" height="40" rx="10" fill="#ebe6f4"/>
<text x="648" y="551" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6b5d7d" font-weight="700">TRANSIENT</text>
<text x="636" y="590" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#455d70" font-weight="500">Concept: temperatures change over time</text>
<text x="636" y="619" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#455d70" font-weight="500">after a boundary condition changes.</text>
<text x="636" y="648" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#455d70" font-weight="500">Not a time-history measurement.</text>

<line x1="68" y1="687" x2="1132" y2="687" stroke="#cbd8e1" stroke-width="2"/>
<text x="68" y="712" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#586d7e" font-weight="500">Qualitative illustration only. Generic geometry, not project hardware or a validation result.</text>
<rect x="950" y="691" width="211" height="40" rx="10" fill="#e8f0f5"/>
<text x="965" y="717" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#3e637b" font-weight="700">RECONSTRUCTED</text>
</svg>