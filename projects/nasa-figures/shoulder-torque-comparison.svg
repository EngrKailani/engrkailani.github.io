-serif" font-size="22" fill="#263b4d" font-weight="600" text-anchor="start" >top of the estimated</text><text x="823" y="349" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#263b4d" font-weight="600" text-anchor="start" >actuator capability range.</text><text x="823" y="381" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#263b4d" font-weight="600" text-anchor="start" >Requires further engineering</text><text x="823" y="413" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#263b4d" font-weight="600" text-anchor="start" >review and verification.</text><rect x="798" y="461" width="333" height="188" rx="17" fill="#edf5f0" stroke="#c1d6c6" stroke-width="2" /><rect x="823" y="475" width="245" height="40" rx="10" fill="#dceadf" stroke="#dceadf" stroke-width="2" /><text x="837" y="501" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#356751" font-weight="700" text-anchor="start" >INTERPRETATION</text><text x="823" y="551" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#36584c" font-weight="500" text-anchor="start" >27.23 lbf-in calculated</text><text x="823" y="580" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#36584c" font-weight="500" text-anchor="start" >18.6–24.9 lbf-in estimated</text><text x="823" y="609" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#36584c" font-weight="500" text-anchor="start" >Not a measured torque test.</text>
