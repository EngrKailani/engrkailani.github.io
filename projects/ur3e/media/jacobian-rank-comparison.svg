<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">Illustrative comparison of UR3e Jacobian rank in two reported poses</title>
<desc id="desc">Left panel illustrates reported zero-angle configuration Jacobian rank five out of six, including one unavailable instantaneous motion direction. Right panel illustrates a separately evaluated pose with full rank six out of six. Bars encode reported matrix rank, not singular values or measured pose data.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#30253d"/><stop offset="1" stop-color="#1c1929"/></linearGradient></defs>
<rect width="1120" height="490" rx="25" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="37" y="42" font-size="15" font-weight="700" letter-spacing="2" fill="#c9adca">JACOBIAN RANK / REPORTED GROUP ANALYSIS</text>
<text x="1080" y="42" text-anchor="end" font-size="12" fill="#b9a7c2">SCHEMATIC · NOT A MEASURED MATRIX</text>
<line x1="35" x2="1085" y1="60" y2="60" stroke="#665671"/>
<rect x="36" y="85" width="505" height="330" rx="17" fill="#463549" stroke="#a17892"/>
<rect x="579" y="85" width="505" height="330" rx="17" fill="#334450" stroke="#78a9a9"/>
<text x="65" y="124" font-size="22" font-weight="700" fill="#fff0f6">Zero-angle configuration</text>
<text x="608" y="124" font-size="22" font-weight="700" fill="#e5fffa">Another evaluated configuration</text>
<text x="65" y="156" font-size="14" fill="#d9bacb">Reported singular pose</text>
<text x="608" y="156" font-size="14" fill="#bde3dd">Reported full-rank pose</text>
<text x="65" y="222" font-size="51" font-weight="700" fill="#ffc6dd">5 / 6</text>
<text x="608" y="222" font-size="51" font-weight="700" fill="#a5e8df">6 / 6</text>
<text x="65" y="246" font-size="14" fill="#f3dce7">Jacobian rank</text>
<text x="608" y="246" font-size="14" fill="#d4f2ee">Jacobian rank</text>
<g transform="translate(65 270)">
<rect width="55" height="66" rx="6" fill="#e7a4c6"/><rect x="62" width="55" height="66" rx="6" fill="#e7a4c6"/><rect x="124" width="55" height="66" rx="6" fill="#e7a4c6"/><rect x="186" width="55" height="66" rx="6" fill="#e7a4c6"/><rect x="248" width="55" height="66" rx="6" fill="#e7a4c6"/><rect x="310" width="55" height="66" rx="6" fill="none" stroke="#ad839c" stroke-width="2" stroke-dasharray="6 4"/>
<g font-size="13" fill="#f8f0f4" text-anchor="middle"><text x="27" y="87">1</text><text x="89" y="87">2</text><text x="151" y="87">3</text><text x="213" y="87">4</text><text x="275" y="87">5</text><text x="337" y="87">6</text></g>
</g>
<g transform="translate(608 270)">
<rect width="55" height="66" rx="6" fill="#8bd8ce"/><rect x="62" width="55" height="66" rx="6" fill="#8bd8ce"/><rect x="124" width="55" height="66" rx="6" fill="#8bd8ce"/><rect x="186" width="55" height="66" rx="6" fill="#8bd8ce"/><rect x="248" width="55" height="66" rx="6" fill="#8bd8ce"/><rect x="310" width="55" height="66" rx="6" fill="#8bd8ce"/>
<g font-size="13" fill="#e8f7f4" text-anchor="middle"><text x="27" y="87">1</text><text x="89" y="87">2</text><text x="151" y="87">3</text><text x="213" y="87">4</text><text x="275" y="87">5</text><text x="337" y="87">6</text></g>
</g>
<text x="65" y="387" font-size="13" fill="#f4d8e5">One instantaneous task-space direction lost locally</text>
<text x="608" y="387" font-size="13" fill="#d2f4ec">Six instantaneous task-space directions locally available</text>
<text x="39" y="454" font-size="13" fill="#d1c6d8">Rows show reported rank only; not the size of singular values, conditioning, velocity capability, or validation on hardware.</text>
</g>
</svg>